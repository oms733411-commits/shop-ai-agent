name: Shop AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:

      - name: Download Shop Brain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📥 Downloading shop.yaml..."

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/shop.yaml/shop.yaml?ref=main" \
            -o shop.yaml

          echo "✅ shop.yaml downloaded"
          wc -c shop.yaml

      - name: Download Agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📥 Downloading agent.py..."

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/agent.py/agent.py?ref=main" \
            -o agent.py

          echo "✅ agent.py downloaded"
          wc -c agent.py

          echo "First 10 lines:"
          head -n 10 agent.py

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🚀 Starting Ghar Tak AI Agent..."
          python3 --version
          python3 -u agent.py

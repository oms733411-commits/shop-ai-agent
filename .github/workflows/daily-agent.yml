name: Shop AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Download Shop Brain
        run: |
          curl -fsSL https://raw.githubusercontent.com/oms733411-commits/shop-ai-agent/main/shop.yaml -o shop.yaml

      - name: Download Agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/oms733411-commits/shop-ai-agent/main/agent.py -o agent.py

      - name: Run Agent
        run: |
          python3 agent.py
